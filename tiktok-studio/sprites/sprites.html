const B = {};
B.cup = () => {

};
function euroShape() {
  const s = new THREE.Shape(); const R = 0.52, r = 0.38, a0 = 0.75, a1 = 2 * Math.PI - 0.75;

B.coin = (opts = {}) => {

B.snowball = () => {
  let geo = new THREE.IcosahedronGeometry(1, 6); geo.deleteAttribute('normal'); geo.deleteAttribute('uv'); geo = mergeVertices(geo);
